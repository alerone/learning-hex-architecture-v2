rootProject.name = 'guildboard'
['quests', 'adventurers', 'treasury'].each { service ->
    ['domain', 'application', 'adapters', 'bootstrap'].each { module ->
        def projectName = "${service}-${module}"
        include projectName
        project(":${projectName}").projectDir =
        file("services/${service}/${module}")
    }
}
