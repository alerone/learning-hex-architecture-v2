plugins {
        id 'org.springframework.boot'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:' +
            'spring-cloud-dependencies:2025.1.3'
    }
}

dependencies {
    implementation project(':quests-adapters')
    implementation project(':quests-application')

    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.springframework.boot:' +
        'spring-boot-starter-security-oauth2-resource-server'

    implementation 'org.springframework.boot:' + 
        'spring-boot-starter-actuator'

    implementation 'org.springframework.cloud:' +
        'spring-cloud-starter-config'

    implementation 'org.springframework.boot:' +
        'spring-boot-starter-restclient'

    implementation 'org.springframework.boot:spring-boot-starter-zipkin'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
