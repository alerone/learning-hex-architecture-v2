plugins {
        id 'org.springframework.boot'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:' +
            'spring-cloud-dependencies:2025.1.3'
    }
}

dependencies {
    implementation project(':treasury-adapters')
    implementation project(':treasury-application')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:' +
        'spring-boot-starter-security-oauth2-resource-server'

    implementation 'org.springframework.cloud:' +
        'spring-cloud-starter-config'

    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}
