services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: guildboard
      POSTGRES_USER: guildboard
      POSTGRES_PASSWORD: guildboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guildboard -d guildboard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
