services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports: 
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: guildboard
      POSTGRES_USER: guildboard
      POSTGRES_PASSWORD: guildboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guildboard -d guildboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/application/default"]
      interval: 5s
      timeout: 3s 
      retries: 20
      start_period: 20s

  token-issuer:
    build: ./tools/token-issuer
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/.well-known/jwks.json"]
      interval: 5s
      timeout: 3s 
      retries: 20
      start_period: 20s

  adventurers:
    build: ./services/adventurers/bootstrap
    environment:
      SPRING_PROFILES_ACTIVE: docker,postgres
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs",
        "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  treasury:
    build: ./services/treasury/bootstrap
    environment:
      SPRING_PROFILES_ACTIVE: docker,postgres
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs",
        "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  quests:
    build: ./services/quests/bootstrap
    environment:
      SPRING_PROFILES_ACTIVE: docker,postgres
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      config-server:
        condition: service_healthy
      adventurers:
        condition: service_healthy
      treasury:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs",
        "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  gateway:
    build: ./gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    ports:
      - "8080:8080"
    depends_on:
      zipkin:
        condition: service_healthy
      config-server:
        condition: service_healthy
      quests:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s 
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  kafka-data:
