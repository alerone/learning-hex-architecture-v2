server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: quests
              uri: http://localhost:8081
              predicates:
                - Path=/api/quests/**
              filters:
                - StripPrefix=1
            - id: adventurers
              uri: http://localhost:8082
              predicates:
                - Path=/api/adventurers/**
              filters:
                - StripPrefix=1
            - id: treasury
              uri: http://localhost:8083
              predicates:
                - Path=/api/treasury/**
              filters:
                - StripPrefix=2
